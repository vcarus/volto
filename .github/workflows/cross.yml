name: Cross

# The release workflow is the only thing that normally exercises the musl
# cross-builds, so a dependency bump that breaks one -- aws-lc-sys carries a
# large C build that only these targets compile through a cross toolchain --
# would otherwise surface at tag time, after the fix window has closed. This
# runs the exact build step release.yml runs, on a change to the dependency
# surface, to the build itself, to `script/` or to `src/`. A pull request that
# changes only documentation, tests or another workflow does not run it.
#
# A workflow of its own rather than a job in ci.yml because the gate is the
# `paths` filter, and `on.paths` is workflow-scoped.

# The second job installs each built binary with the release's own installer
# on a runner of the binary's architecture and drives it through the unit's
# sandbox. `script/` and `src/` are in the filter for that job. The installer
# and the unit are what it runs, and a source change is what can add a system
# call the unit's filter refuses or a read of a `/proc` path the unit hides.
#
# `release.yml` is in the filter because the build step below is a copy of its
# own: a change to that step is exactly the change this workflow exists to run,
# and without the entry it would be the one change that runs nothing.
# `Cross.toml` and `.github/cross/` are in it because they choose the image
# that step builds in, and a Dependabot bump of that image changes nothing else.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cross.yml
      - .github/workflows/release.yml
      - Cross.toml
      - .github/cross/**
      - script/**
      - src/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/cross.yml
      - .github/workflows/release.yml
      - Cross.toml
      - .github/cross/**
      - script/**
      - src/**

# As in ci.yml: a new push to a pull request supersedes its running check, and
# on main every commit keeps its own run. A push keys on its commit, because
# with one group for the branch GitHub keeps one pending run per group and a
# newer push cancels the pending one.
concurrency:
  group: cross-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirrors the build step in release.yml verbatim -- same action, same
      # pinned SHA, same arguments -- so a green run here is evidence about
      # the release build itself, not about a similar one. "Verbatim" is not a
      # request: `tests/it_release_assets.rs` compares the two blocks between
      # the markers below and fails if they differ by a byte, and release.yml is
      # in this workflow's `paths` filter so editing that side runs this side.
      # >>> mirrored build step (release.yml <-> cross.yml) >>>
      # `force-use-cross: true` builds both targets inside a `cross` image. The
      # server's TLS (D115) builds AWS-LC's libssl, which is C++, through cmake
      # and generates its bindings with bindgen. The `cross` images carry
      # cmake, libclang, a musl C++ compiler and the bindgen sysroot for each
      # target. The runner does not: the action would otherwise build the
      # x86_64 target on the runner with musl-gcc, where no musl C++ compiler
      # exists and bindgen finds no C headers for a musl target.
      # `Cross.toml` names each target's image by tag and digest.
      # `strip: true` is the action's own input and it is a no-op for a target
      # this action cross-builds, which is how the first v0.10.0 release shipped
      # an 8.62 MB aarch64 asset against 2.98 MB. What strips is `strip = true`
      # in `[profile.release]`; this input is kept as a second layer for the
      # targets where it does something, and it guarantees nothing on its own.
      # The step after this one is what proves either of them ran.
      - uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true
          force-use-cross: true
          # The `cross` program itself. Without this the action installs
          # whatever release is the latest on the day of the build, so the
          # tool that drives the pinned image could change under a release.
          # It matches the image tag in `.github/cross/`; Dependabot does
          # not read this line, so move the two together by hand.
          cross-version: v0.2.5
      # <<< mirrored build step (release.yml <-> cross.yml) <<<

      # >>> mirrored smoke step (release.yml <-> cross.yml) >>>
      - name: The built binary runs
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/volto"
          work="$(mktemp -d)"
          : > "$work/cert.pem"
          : > "$work/key.pem"
          printf '[server]\nlisten = "127.0.0.1:14443"\ncert = "%s"\nkey = "%s"\n' \
            "$work/cert.pem" "$work/key.pem" > "$work/config.toml"
          "$binary" --version
          "$binary" --check-config --config "$work/config.toml"
      # <<< mirrored smoke step (release.yml <-> cross.yml) <<<

      # release.yml makes this assertion on the copy in `dist/`, inside the step
      # that packages the tarball, so it cannot be part of the mirrored block.
      # Made here on the binary this workflow just built, it moves the signal to
      # the pull request that changes `Cargo.toml`, which is what this
      # workflow's `paths` filter already selects.
      - name: The built binary is stripped
        run: |
          set -euo pipefail
          command -v readelf >/dev/null ||
            { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends binutils; }
          binary="target/${{ matrix.target }}/release/volto"
          sections="$(readelf -S --wide "$binary")"
          # Floor first: a reader that found nothing must fail rather than
          # report a clean binary.
          printf '%s\n' "$sections" | grep -q '[[:space:]]\.text[[:space:]]' ||
            { echo "::error::readelf -S found no .text section in ${binary}; this check is broken, not the binary" >&2; exit 1; }
          carried="$(printf '%s\n' "$sections" |
            awk '{ for (i = 1; i <= NF; i++) if ($i == ".symtab" || $i == ".debug_info") print $i }' |
            sort -u | tr '\n' ' ')"
          [ -z "$carried" ] ||
            { echo "::error::${binary} still carries ${carried}-- a release built from this branch would not be stripped" >&2; exit 1; }

      # For the `installed` job below, which runs on the target's architecture.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: volto-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/volto
          if-no-files-found: error
          retention-days: 3

  installed:
    # The suite never starts the server under systemd, and the x86_64 smoke
    # step above runs the binary outside any sandbox. This job installs the
    # release binary with `script/install-selfsigned.sh`, which installs
    # `script/masque.service`, and then checks three things no cargo test can:
    # systemd accepts every directive of the unit, the process runs with the
    # sandbox the unit sets, and tunnels work from inside that sandbox,
    # where `/proc` holds processes only and the system call filter is on.
    # The aarch64 half runs on an arm runner, so the claim that AWS-LC finds
    # the CPU's features there without `/proc/cpuinfo` is tested and not read
    # from its source.
    name: installed (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      VOLTO_ADDR: 127.0.0.1:14443
      VOLTO_SNI: localhost
      VOLTO_USER: interop
      VOLTO_PASSWORD: interop-password-not-a-secret
      # A copy: /etc/volto is closed to every user but root and the service.
      VOLTO_CERT: ${{ github.workspace }}/installed-cert.pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: volto-${{ matrix.target }}

      - name: Install with the release's installer
        run: |
          set -euo pipefail
          chmod +x volto
          ./volto --version
          sudo env PASSWORD="$VOLTO_PASSWORD" script/install-selfsigned.sh \
            --binary ./volto --sni "$VOLTO_SNI" --port "${VOLTO_ADDR##*:}" --username "$VOLTO_USER"
          systemctl is-active volto

      - name: systemd accepts every directive of the unit
        run: |
          set -euo pipefail
          # `verify` prints a line for a directive this systemd does not know
          # and still exits 0, so any output fails.
          report="$(systemd-analyze verify /etc/systemd/system/volto.service 2>&1)"
          printf '%s\n' "$report"
          [ -z "$report" ]

      - name: The process runs inside the unit's sandbox
        run: |
          set -euo pipefail
          pid="$(systemctl show -p MainPID --value volto)"
          [ "$pid" -gt 1 ]
          status="$(sudo cat "/proc/$pid/status")"
          mounts="$(sudo cat "/proc/$pid/mountinfo")"
          printf '%s\n' "$status" | grep -E '^(Uid|Umask|CapEff|CapBnd|NoNewPrivs|Seccomp):'
          printf '%s\n' "$mounts" | grep ' /proc '
          expect() { printf '%s\n' "$1" | grep -Eq "$2" || { echo "::error::$3" >&2; exit 1; }; }
          expect "$status" '^NoNewPrivs:[[:space:]]+1$' 'NoNewPrivileges= is not in force'
          expect "$status" '^Seccomp:[[:space:]]+2$' 'no system call filter is installed'
          expect "$status" '^Umask:[[:space:]]+0077$' 'UMask= is not in force'
          # CAP_NET_BIND_SERVICE is bit 10 and nothing else is set.
          expect "$status" '^CapEff:[[:space:]]+0000000000000400$' 'the effective capability set is not CAP_NET_BIND_SERVICE alone'
          expect "$status" '^CapBnd:[[:space:]]+0000000000000400$' 'the bounding capability set is not CAP_NET_BIND_SERVICE alone'
          expect "$mounts" ' /proc .*subset=pid' 'ProcSubset=pid is not in force'
          expect "$mounts" ' /proc .*hidepid=invisible' 'ProtectProc=invisible is not in force'
          [ "$(id -u volto)" = "$(printf '%s\n' "$status" | awk '$1 == "Uid:" { print $2 }')" ]

      # The suite's targets are echo servers on loopback, which the installed
      # configuration refuses, as it must on a real host. The reload is also
      # the check that SIGHUP works under the sandbox and keeps the process.
      - name: Allow loopback targets by a reload
        run: |
          set -euo pipefail
          before="$(systemctl show -p MainPID --value volto)"
          sudo sed -i 's/^\[security\]$/[security]\nallow_private_networks = true/' /etc/volto/config.toml
          sudo grep -q '^allow_private_networks = true$' /etc/volto/config.toml
          sudo systemctl reload volto
          for _ in $(seq 1 50); do
            sudo journalctl -u volto --no-pager | grep -q 'configuration reloaded' && break
            sleep 0.2
          done
          sudo journalctl -u volto --no-pager | grep 'configuration reloaded'
          [ "$before" = "$(systemctl show -p MainPID --value volto)" ]

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/interop/aioquic/requirements.txt

      - name: Drive the installed service with aioquic
        run: |
          set -euo pipefail
          sudo cat /etc/volto/cert.pem > "$VOLTO_CERT"
          pip install -r tests/interop/aioquic/requirements.txt
          python tests/interop/aioquic/interop_test.py

      - name: The service stops cleanly and its journal has no error
        if: always()
        run: |
          set -euo pipefail
          sudo systemctl stop volto || true
          journal="$(sudo journalctl -u volto --no-pager)"
          printf '%s\n' "$journal"
          [ "$(systemctl show -p Result --value volto)" = success ]
          [ "$(systemctl show -p NRestarts --value volto)" = 0 ]
          if printf '%s\n' "$journal" | grep -E ' ERROR |panicked'; then exit 1; fi
