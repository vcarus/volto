name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # Static musl binaries, so a release runs on any glibc vintage. ring needs
      # a working cross C toolchain for aarch64, which is what `cross` provides;
      # --locked keeps the load-bearing h3/h3-quinn git pins intact.
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="volto-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}/script"
          cp "target/${{ matrix.target }}/release/volto" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          cp script/install-selfsigned.sh script/config.example.toml \
             script/masque.service "dist/${name}/script/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: volto-${{ matrix.target }}
          path: "*.tar.gz"
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            Static musl builds for x86_64 and aarch64. Verify with `SHA256SUMS`.

            Each archive carries the binary, `LICENSE`, `README.md` and the
            `script/` directory, so the self-signed installer runs straight out
            of it:

            ```sh
            tar xzf volto-*-x86_64-unknown-linux-musl.tar.gz
            cd volto-*-x86_64-unknown-linux-musl
            sudo script/install-selfsigned.sh --binary ./volto
            ```
