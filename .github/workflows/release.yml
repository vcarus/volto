name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Only the job that publishes gets to write, and only to releases (see below).
# Actions are pinned to full commit SHAs, as in ci.yml, because this workflow
# holds the token that could replace a published archive.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Static musl binaries, so a release runs on any glibc vintage. aws-lc-rs
      # needs a working cross C toolchain for aarch64, which is what `cross`
      # provides; the non-FIPS build ships pre-generated bindings, so it wants a
      # C compiler but neither cmake nor bindgen nor Go. --locked keeps the
      # committed lockfile, quinn-proto patch included.
      - uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # deploy.sh decides "already deployed" by comparing `volto --version`
          # against the release tag; a tag that does not match the crate version
          # would make every timered host reinstall and restart daily, forever.
          grep -q "^version = \"${version}\"\$" Cargo.toml ||
            { echo "tag ${GITHUB_REF_NAME} does not match the version in Cargo.toml" >&2; exit 1; }
          name="volto-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}/script"
          cp "target/${{ matrix.target }}/release/volto" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          cp script/install-selfsigned.sh script/deploy.sh \
             script/config.example.toml script/masque.service "dist/${name}/script/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volto-${{ matrix.target }}
          path: "*.tar.gz"
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The changelog lives in the tag's annotation. Check the repository out
      # before anything else: checkout cleans the workspace, so the artifacts
      # have to land after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          set -euo pipefail
          # actions/checkout can leave the tag as a lightweight copy; fetch the
          # real object so its annotation is readable. An unannotated tag makes
          # the changelog section empty and the notes fall back to boilerplate.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
          cat >> notes.md <<'BOILERPLATE'

          ---

          Static musl builds for x86_64 and aarch64. Verify with `SHA256SUMS`.

          Each archive carries the binary, `LICENSE`, `README.md` and the `script/` directory, so the self-signed installer runs straight out of it:

          ```sh
          tar xzf volto-*-x86_64-unknown-linux-musl.tar.gz
          cd volto-*-x86_64-unknown-linux-musl
          sudo script/install-selfsigned.sh --binary ./volto
          ```

          Or skip the manual download entirely: `script/deploy.sh` fetches the newest release itself, verifies it against `SHA256SUMS` and installs or updates in place — with `--enable-timer` it keeps the host on the latest release with a daily systemd timer. It bootstraps a bare host in one line:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/vcarus/volto/main/script/deploy.sh | sudo bash -s -- --enable-timer
          ```
          BOILERPLATE
          cat notes.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          body_path: notes.md
