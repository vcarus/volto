name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Only the job that publishes gets to write, and only to releases (see below).
# Actions are pinned to full commit SHAs, as in ci.yml, because this workflow
# holds the token that could replace a published archive.
permissions:
  contents: read

jobs:
  ci-passed:
    # A tag is a push like any other, and nothing here used to ask whether the
    # commit it names had ever been green: `git tag && git push --tags` on a
    # commit whose CI was red published binaries anyway, and the failing run sat
    # next to the release on the same commit page. The workflows are separate on
    # purpose (ci.yml runs on pushes and pull requests, this one on tags), so the
    # link has to be made explicitly, which is what this job is.
    #
    # It asks a question, it does not wait for an answer: a tag pushed in the
    # same breath as the commit will find CI still running and fail here. That is
    # the intended shape -- push the tag once the commit is green, or re-run this
    # workflow from the Actions tab afterwards. Nothing has been published at
    # this point, since every other job needs this one.
    name: require CI on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh run list` reads workflow runs, which `contents: read` does not cover.
      actions: read
    steps:
      - name: Require a successful ci.yml run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set so the query needs no checkout: `gh` would otherwise look for a
          # git remote in the working directory and find none.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `github.sha` is the full 40-character commit the tag points at, and
          # that matters more than it looks: `--commit` matches the string
          # literally and answers an *empty list* for an abbreviated SHA,
          # without an error. The empty case is therefore failed explicitly
          # below rather than left to a `select` that finds nothing.
          runs="$(gh run list --commit "${{ github.sha }}" --workflow ci.yml \
            --limit 20 --json databaseId,status,conclusion,event)"
          echo "$runs"

          green="$(printf '%s' "$runs" |
            jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"

          if [ "$green" -eq 0 ]; then
            echo "::error::no successful ci.yml run for ${{ github.sha }} — refusing to publish ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "ci.yml is green for ${{ github.sha }} ($green successful run(s))"

  build:
    name: build (${{ matrix.target }})
    needs: ci-passed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Static musl binaries, so a release runs on any glibc vintage. aws-lc-rs
      # needs a working cross C toolchain for aarch64, which is what `cross`
      # provides; the non-FIPS build ships pre-generated bindings, so it wants a
      # C compiler but neither cmake nor bindgen nor Go. --locked keeps the
      # committed lockfile, quinn-proto patch included.
      #
      # cross.yml runs this exact step on the pull requests that can break it,
      # which is only worth anything while the two are identical. The markers
      # below delimit what `tests/it_release_assets.rs` compares between the two
      # files; the prose stays outside them, since only the step has to match.
      # >>> mirrored build step (release.yml <-> cross.yml) >>>
      - uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true
      # <<< mirrored build step (release.yml <-> cross.yml) <<<

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # deploy.sh decides "already deployed" by comparing `volto --version`
          # against the release tag; a tag that does not match the crate version
          # would make every timered host reinstall and restart daily, forever.
          grep -q "^version = \"${version}\"\$" Cargo.toml ||
            { echo "tag ${GITHUB_REF_NAME} does not match the version in Cargo.toml" >&2; exit 1; }
          name="volto-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}/script"
          cp "target/${{ matrix.target }}/release/volto" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          cp script/install-selfsigned.sh script/deploy.sh \
             script/config.example.toml script/masque.service "dist/${name}/script/"
          # Both scripts point the operator at `docs/configuration.md` or
          # `docs/deployment.md` at the moment they refuse to install -- an
          # unknown config key on a downgrade, a config the new binary cannot
          # load, a host that is not Debian. That is the worst moment for the
          # file to be absent, and on a host bootstrapped from a tarball it was:
          # nothing but the binary, the licence, the README and `script/` ever
          # reached it. Copied as a directory rather than by name, so a new page
          # needs no change here.
          cp -R docs "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: volto-${{ matrix.target }}
          path: "*.tar.gz"
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The changelog lives in the tag's annotation. Check the repository out
      # before anything else: checkout cleans the workspace, so the artifacts
      # have to land after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          set -euo pipefail
          # actions/checkout can leave the tag as a lightweight copy; fetch the
          # real object so its annotation is readable. An unannotated tag makes
          # the changelog section empty and the notes fall back to boilerplate.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
          cat >> notes.md <<'BOILERPLATE'

          ---

          Static musl builds for x86_64 and aarch64. Verify with `SHA256SUMS`.

          Each archive carries the binary, `LICENSE`, `README.md` and the `script/` and `docs/` directories. Installing and updating is described in [docs/deployment.md](https://github.com/vcarus/volto/blob/main/docs/deployment.md).
          BOILERPLATE
          cat notes.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          body_path: notes.md
