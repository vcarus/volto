name: Docs

# The published site at https://vcarus.github.io/volto/, rebuilt from `main` on
# every push. It has two halves, and one job builds both into `site/`:
#
#   * the **manual** at the root -- mdBook over `docs/`, the same pages that
#     ship in the release tarball, with `docs/SUMMARY.md` as its contents; and
#   * the crate's **rustdoc** under `/api/`, laid out so that `/api/` is the
#     crate page itself rather than a redirect into `/api/volto/`.
#
# It runs only on `main`: a pull request cannot publish, and nothing in it needs
# more than read access to the repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deployments queue rather than cancel: Pages serves whichever finished last,
# and cancelling one midway would leave a stale site behind a newer commit.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: site
    runs-on: ubuntu-latest
    env:
      # mdBook 0.5.4, the latest release at the time this was pinned
      # (2026-09-02). Pinned by version *and* by digest of the exact asset:
      # a release tarball can be replaced in place, and this step runs with the
      # repository checked out. `cargo install` is deliberately not used -- it
      # would build a second dependency tree on every run and pin nothing.
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_SHA256: "5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install mdBook
        run: |
          set -euo pipefail
          tarball="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${tarball}"
          echo "${MDBOOK_SHA256}  ${tarball}" | sha256sum --check --strict -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$tarball" -C "$HOME/.local/bin" mdbook
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `book.toml` points mdBook straight at `docs/`, so the book is built from
      # the tracked pages with nothing copied or generated in between.
      - name: Build the manual
        run: |
          set -euo pipefail
          mdbook --version
          mdbook build
          mkdir -p site
          cp -R target/book/. site/
          test -f site/index.html

      # The same invocation the CI gate runs, so what gets published is exactly
      # what passed.
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # rustdoc writes the crate one directory down, so `/api/` would answer
      # with a redirect page into `/api/volto/`. This lifts the crate's own
      # pages to the root of the API subtree: `/api/` is the crate page itself,
      # `/api/config/struct.Config.html` is a type, and the shared trees
      # (`src/`, `static.files/`, `search.index/`, `trait.impl/`) stay where
      # rustdoc put them, one level below `/api/`.
      #
      # Two halves, and the second is why this is a script rather than a `mv`.
      # Moving a page one level up makes every reference it holds *to the doc
      # root* one `../` too deep, so those are rewritten -- and only those: a
      # link from one module to its sibling is relative to the subtree that
      # moved with it, and must not be touched. A reference is root-anchored
      # exactly when it climbs as many levels as the page is deep, which is what
      # the rewrite tests for. The doc root here is `site/api`, so nothing in
      # the rewrite reaches out of the API subtree and into the book.
      #
      # The second half is the crate directory rustdoc's own JavaScript still
      # asks for. Search results, the crates list and the trait implementor
      # links are all built at runtime as `rootPath + "volto/" + ...` from paths
      # inside `search.index/` and `trait.impl/`, none of which is a document
      # this step can honestly rewrite. So `api/volto/` survives the move as a
      # tree of redirect stubs -- the same device rustdoc emits for a
      # re-exported item -- and every one of them is checked to point at a file
      # that exists.
      - name: Lay the crate out under /api/
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import shutil

          built = pathlib.Path("target/doc")
          doc = pathlib.Path("site/api")
          crate = "volto"
          if not (built / crate).is_dir():
              raise SystemExit(f"{built / crate} is missing; did `cargo doc` run?")
          if doc.exists():
              shutil.rmtree(doc)
          shutil.copytree(built, doc)
          crate_dir = doc / crate

          # A module named like one of rustdoc's own root entries would land on
          # top of it. Nothing in this crate does today; this is what says so
          # tomorrow.
          clashes = {p.name for p in crate_dir.iterdir()} & {
              p.name for p in doc.iterdir() if p.name != crate
          }
          if clashes:
              raise SystemExit(f"moving the crate to {doc} would overwrite {sorted(clashes)}")

          reference = re.compile(r"((?:\.\./)+)([A-Za-z0-9_./%-]*)")
          rewritten = 0

          for path in sorted(crate_dir.rglob("*")):
              if not path.is_file() or path.suffix not in {".html", ".js", ".css"}:
                  continue
              # How many levels of `../` a reference from this file needs to
              # reach the doc root -- which is exactly what a root-anchored one
              # spells, and one more than it will need after the move.
              depth = len(path.relative_to(doc).parts) - 1

              def lift(match):
                  ups, rest = match.group(1), match.group(2)
                  if len(ups) // 3 != depth:
                      return match.group(0)
                  if rest.startswith(f"{crate}/"):
                      rest = rest[len(crate) + 1 :]
                  return ("../" * (depth - 1) if depth > 1 else "./") + rest

              text = path.read_text(encoding="utf-8")
              lifted = reference.sub(lift, text)
              if lifted != text:
                  path.write_text(lifted, encoding="utf-8")
                  rewritten += 1

          pages = [p.relative_to(crate_dir) for p in sorted(crate_dir.rglob("*.html"))]
          for entry in list(crate_dir.iterdir()):
              shutil.move(str(entry), str(doc / entry.name))
          crate_dir.rmdir()

          # The stubs rustdoc's JavaScript still navigates to.
          for page in pages:
              target = doc / page
              if not target.is_file():
                  raise SystemExit(f"{page} did not survive the move")
              stub = crate_dir / page
              stub.parent.mkdir(parents=True, exist_ok=True)
              back = "../" * len(stub.relative_to(doc).parts[:-1])
              href = f"{back}{page.as_posix()}"
              # The script carries the fragment across, which the meta refresh
              # cannot: a search result for a method arrives as
              # `struct.Config.html#method.warnings`, and landing at the top of
              # the right page would be a worse answer than the one asked for.
              # The meta refresh stays as the answer for a reader without
              # JavaScript.
              stub.write_text(
                  "<!DOCTYPE html><html><head><meta charset=\"utf-8\">"
                  f"<script>location.replace(\"{href}\" + location.hash)</script>"
                  f"<meta http-equiv=\"refresh\" content=\"0;URL={href}\">"
                  "<title>Redirection</title></head><body>"
                  f"<a href=\"{href}\">Click here if you are not redirected.</a>"
                  "</body></html>\n",
                  encoding="utf-8",
              )

          (doc / ".lock").unlink(missing_ok=True)

          if rewritten == 0 or len(pages) == 0:
              raise SystemExit("the layout step found nothing to do, which cannot be right")
          print(f"lifted {len(pages)} pages to site/api/, rewriting {rewritten} files")
          print(f"left {len(pages)} redirect stubs under api/{crate}/")
          PY

      # A published page that 404s on its stylesheet looks like a broken site,
      # and nothing else in this workflow would notice: `mdbook build` is happy,
      # `cargo doc` is happy, the upload is happy, and the site is wrong. So the
      # artifact is served exactly as Pages will serve it and crawled from both
      # roots -- the book at `/` and the crate at `/api/`, which no page links to
      # with a same-host href because the manual names it by its public URL --
      # following every `href` and `src`, pages, stylesheets, scripts and images
      # alike, and failing on the first status that is not 200. Only this host is
      # fetched, so the crawl neither needs the network nor judges rustdoc's
      # links to doc.rust-lang.org. The visited count is asserted as well: a
      # server that answered nothing would otherwise pass, having found no broken
      # link among the zero pages it visited.
      #
      # Fragments are checked too, for the book: a link to `x.html#y` has to find
      # `id="y"` in `x.html`. That is the half `tests/it_docs.rs` cannot see -- it
      # judges anchors by GitHub's slug rules on the markdown, and mdBook has a
      # slugger of its own, so agreement between the two is a claim this proves
      # rather than assumes. rustdoc's fragments are left out: many of its ids
      # arrive with the page's own JavaScript, and a static reader would call
      # them missing.
      #
      # A hand-written crawl rather than `wget --spider -r -p`, for one reason
      # that matters here: wget scans script *bodies* for anything URL-shaped,
      # so rustdoc's inline JavaScript has it invent paths like `/config/
      # dispatcher` and report them as broken links. `html.parser` reads script
      # content as text, which is what it is.
      - name: Verify the site has no broken links
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory site &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 50); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break
            sleep 0.2
          done
          python3 - <<'PY'
          import collections
          import html.parser
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "http://127.0.0.1:8080/"
          api = base + "api/"

          class Page(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in ("href", "src") and value:
                          self.links.append(value)
                      elif name == "id" and value:
                          self.ids.add(value)

          status = {}
          ids = {}
          origin = {base: "the crawl root", api: "the crawl root"}
          anchors = []
          queue = collections.deque([base, api])

          while queue:
              url = queue.popleft()
              if url in status:
                  continue
              try:
                  with urllib.request.urlopen(url) as response:
                      status[url] = response.status
                      kind = response.headers.get_content_type()
                      body = response.read() if kind == "text/html" else b""
              except urllib.error.HTTPError as error:
                  status[url] = error.code
                  continue
              if not body:
                  continue
              page = Page()
              page.feed(body.decode("utf-8", "replace"))
              ids[url] = page.ids
              for link in page.links:
                  target, fragment = urllib.parse.urldefrag(urllib.parse.urljoin(url, link))
                  if not target.startswith(base):
                      continue
                  if target not in status:
                      origin.setdefault(target, url)
                      queue.append(target)
                  if fragment and not target.startswith(api):
                      anchors.append((target, fragment, url))

          # rustdoc renders tracing's blanket `WithSubscriber` and `Instrument`
          # impls onto this crate's own types, and those doc comments carry
          # tracing's own relative link `dispatcher#setting-the-default-subscriber`.
          # It resolves inside tracing's documentation and nowhere else, so
          # `cargo doc --no-deps` has always emitted it dangling -- 17 of them,
          # the same 17 before the layout step and after it. Excused by name
          # rather than ignored, and the excuse has to be used: if the link stops
          # appearing, this fails and the allowance goes with it.
          allowed = ("/dispatcher",)

          failed = sorted(url for url, code in status.items() if code != 200)
          excused = [url for url in failed if url.endswith(allowed)]
          broken = [url for url in failed if not url.endswith(allowed)]

          for url in broken:
              print(f"{url} -> {status[url]}, linked from {origin[url]}")
          if broken:
              raise SystemExit(f"the published site would serve {len(broken)} broken links")
          for pattern in allowed:
              if not any(url.endswith(pattern) for url in excused):
                  raise SystemExit(f"nothing matched the allowance for {pattern}; delete it")

          dangling = sorted(
              f"{urllib.parse.urlparse(target).path}#{fragment}, linked from {source}"
              for target, fragment, source in anchors
              if status.get(target) == 200 and fragment not in ids.get(target, set())
          )
          for entry in dangling:
              print(entry)
          if dangling:
              raise SystemExit(f"the manual would serve {len(dangling)} links into nothing")

          if len(status) < 100:
              raise SystemExit(f"only {len(status)} URLs crawled; the crawl, not the site, is broken")
          if len(anchors) < 20:
              raise SystemExit(f"only {len(anchors)} fragments seen; the anchor check is broken")
          print(f"crawled {len(status)} URLs: {len(status) - len(excused)} served, {len(excused)} excused upstream links")
          print(f"checked {len(anchors)} fragments against the ids of {len(ids)} pages")
          PY

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # The only write this workflow performs, scoped to the job that performs it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
