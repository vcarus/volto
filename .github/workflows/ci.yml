name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the run already going on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token every job gets unless it says otherwise. Nothing here writes to the
# repository, so nothing here can be made to.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the release it corresponds
# to in a trailing comment; a tag like `@v7` can be moved, a SHA cannot.
# Dependabot reads the comment and bumps both together. `dtolnay/rust-toolchain`
# is the odd one out: it selects the toolchain from the ref it is called with, so
# a SHA pin has to sit on its master branch and name the toolchain explicitly.

env:
  CARGO_TERM_COLOR: always
  # Nothing here is ever an incremental rebuild, and the cache is smaller without
  # the artefacts. What every job does build is the committed lockfile, which is
  # why they all pass `--locked`.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

      # `tests/it_deploy.rs` and `tests/it_installer.rs` both name shellcheck as
      # the coverage for the half of `script/*.sh` no test on either host can
      # run -- the download, the checksum, the rollback, the certificate, the
      # systemd unit, everything behind `must run as root`. That claim was an
      # assertion until this step: nothing in CI ran shellcheck, so a new
      # unquoted expansion in the rollback path would have shipped. It lives in
      # this job because this is the job that compiles nothing, and shellcheck
      # is preinstalled on the ubuntu runner image, so it costs the checkout it
      # was already paying for.
      #
      # Default severity, which is `style`: the two scripts are clean at it
      # today, including the info-level checks, and a finding that is wrong for
      # a particular line is turned off in place with a
      # `# shellcheck disable=SCxxxx` carrying its reason (there is one, on the
      # `trap` in install-selfsigned.sh).
      - name: shellcheck
        run: shellcheck script/*.sh

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--all-features` is what keeps the `operator-runs` targets honest.
      # `it_bench` and `it_resolver_pool` are gated out of `cargo test`
      # (see Cargo.toml), so nothing else in CI compiles them at all and a
      # rename in `src/` or `tests/common/` would break them silently, to be
      # discovered by whoever next runs a benchmark. This is the only job that
      # sees them.
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # rustdoc's own lints -- a link to an item that does not exist, or that a
      # public reader cannot see -- are warnings by default and nothing else
      # runs rustdoc, so they would accumulate unseen.
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # `rust-version = "1.88"` in Cargo.toml and the "Rust 1.88+" in the public
    # docs are claims about the oldest toolchain that builds this crate, but
    # every other job runs `stable`: nothing would notice a newer API slipping
    # in, because the field itself only stops a *user* whose cargo is older --
    # it never checks our code against the declared version. This job builds on
    # exactly that version, so the claim stays true rather than asserted.
    name: msrv
    runs-on: ubuntu-latest
    env:
      # The single place this workflow spells the version; the first step
      # asserts it against Cargo.toml, so the two cannot drift apart silently.
      MSRV: "1.88"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the pin matches Cargo.toml
        run: |
          declared="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$declared" != "$MSRV" ]; then
            echo "::error::Cargo.toml declares rust-version ${declared:-<none>} but this job pins $MSRV"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `check` rather than `test`: whether the suite passes is the `test`
      # job's question, on the toolchain deployments actually build with. The
      # MSRV question is only whether every target still compiles, dev-deps
      # included -- which is also why this is `--all-targets`.
      - run: cargo check --all-targets --locked

  fuzz:
    # `fuzz/` is its own cargo workspace (the cargo-fuzz convention), so no
    # other job in this file so much as parses it. Its eight targets reach into
    # `src` for items that are `pub` only because they ask for them --
    # `h3::stream::build_request`, `tunnel::tcp::split_authority`,
    # `tunnel::udp::parse_target` -- and a rename or a signature change to any
    # of them compiles green everywhere here while leaving the fuzzers broken.
    # Nothing would notice until somebody started the on-demand container run in
    # fuzz/README.md, which is weeks apart by design; the whole point of that
    # crate is to be runnable on the day a parser changes.
    #
    # `cargo check` rather than a build or a run: this job answers "do the
    # targets still compile against today's `src`", not "is there a crash". The
    # runs stay on demand, where a fuzzer's minutes belong.
    #
    # Stable, not the nightly `cargo fuzz` itself needs: libfuzzer-sys type-checks
    # on stable, and this job only asks whether the targets still compile
    # against today's `src`. That keeps the answer about this tree alone --
    # release.yml now needs this workflow green, and a nightly regression is not
    # a reason to hold a release.
    #
    # No `--locked`. `fuzz/Cargo.lock` is committed but stale -- it still
    # records volto 0.5.3 and the pre-D102 `ring` graph -- so `--locked` refuses
    # to run at all today. Refreshing that lockfile is a dependency decision of
    # its own and not this job's to make; without the flag cargo resolves fresh,
    # which is the right behaviour for a rot check anyway.
    name: fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A separate workspace with a target directory of its own; without
          # this the action caches the root workspace and this job warms nothing.
          workspaces: fuzz
      - run: cargo check --manifest-path fuzz/Cargo.toml

  audit:
    # RustSec advisories against the committed `Cargo.lock`. Dependabot already
    # proposes version bumps, but a Dependabot PR is only a suggestion: nothing
    # goes red while it sits unmerged, so a published vulnerability in a
    # transitive dependency would keep shipping until somebody happened to look.
    # This turns it into a failing build instead.
    #
    # A job of its own, and a cheap one: cargo-audit reads the lockfile and never
    # builds the crate, so it shares no cache with the test matrix and cannot
    # slow it down.
    #
    # cargo-audit skips every lockfile entry whose source is not the default
    # registry -- it does not fall back to the version a git dependency declares.
    # Exactly one entry in this lockfile is in that position, the `[patch.crates-io]`
    # pin of `quinn-proto`, and it does not have to stay there: the pinned commit is
    # the upstream `quinn-proto-0.11.17` tag plus three fixes, so advisories against
    # 0.11.17 apply to it verbatim. The second step below recovers it by auditing a
    # copy of the lockfile with that one `source` line pointed back at the registry,
    # which leaves the audit with no blind spot at all. Delete the step together
    # with the patch.
    name: audit (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # All the action writes: one check run carrying the report. It only opens
      # issues on a `schedule` trigger, which this workflow does not have.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails the check on a vulnerability. Informational advisories -- an
      # unmaintained or yanked crate -- are reported in the check run without
      # failing, so they can be seen and acted on at leisure (that is how the
      # `rustls-pemfile` advisory was noticed and the crate dropped). Should a
      # real vulnerability ever have to be accepted, add its RUSTSEC id to
      # `ignore:` with the reason rather than deleting this job.
      #
      # Pinned to a main-branch commit rather than a release: v2.0.0 still
      # declares Node 20, which GitHub now forces onto Node 24 with a warning on
      # every run, and the commit that moved the action to Node 24 (#48,
      # 2026-03-20) has not been tagged. Re-pin to the release once one exists.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main 2026-03-20 (Node 24, unreleased)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # TEMPORARY, and paired with the `[patch.crates-io]` stanza in Cargo.toml:
      # delete both together once quinn-proto ships the fix upstream.
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-audit
      - name: Audit the patched quinn-proto as its upstream release
        run: |
          set -euo pipefail
          LOCK="$RUNNER_TEMP/Cargo.audit.lock"

          # Only inside the quinn-proto entry -- from its `name =` line to the
          # next `[[package]]` header -- so no other git source is touched. A
          # `checksum` line is simply absent for a git entry, which cargo-audit
          # accepts: it reads name, version and source and nothing else.
          sed -e '/^name = "quinn-proto"$/,/^\[\[package\]\]$/ s|^source = "git+.*"$|source = "registry+https://github.com/rust-lang/crates.io-index"|' \
            Cargo.lock > "$LOCK"

          # Assert the rewrite landed. Without this the step would keep passing
          # if the entry ever changed shape, having quietly audited nothing.
          entry="$(grep -A 2 '^name = "quinn-proto"$' "$LOCK")"
          printf '%s\n' "$entry"
          case "$entry" in
            *'source = "registry+https://github.com/rust-lang/crates.io-index"'*) ;;
            *)
              echo "::error::the quinn-proto source rewrite did not apply"
              exit 1
              ;;
          esac

          # Vulnerabilities fail the step; informational advisories are reported
          # without failing, matching the action above. Note that this scan does
          # not read that action's `ignore:` list -- an accepted RUSTSEC id has to
          # be written in both places.
          cargo audit -f "$LOCK"

  test:
    # macOS is the development host and Linux the deployment target; both have to
    # stay green, so the suite runs on both rather than on one of them.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked
        env:
          # The scrub gate (tests/it_scrub.rs) looks for private literals that
          # cannot be written down in a public repository, so the list comes
          # from a repository secret. Absent -- on a fork or a pull request,
          # say -- the variable is empty and only the CJK half of the gate runs;
          # on a push to this repository the test fails instead, so a missing or
          # renamed secret cannot quietly disarm it.
          VOLTO_SCRUB_PATTERNS: ${{ secrets.VOLTO_SCRUB_PATTERNS }}

  interop:
    # Cross-implementation checks. `cargo test` has volto on both ends: since
    # HTTP/3 moved into `src/h3`, its client (`tests/common/h3client.rs`) is
    # built on the server's own codec, so the two agree by construction even
    # where both are wrong. Here a real volto process is driven by two clients
    # that share no code, no QUIC stack and no reading of the RFCs with it or
    # with each other: Go's quic-go/masque-go for CONNECT-UDP, and Python's
    # aioquic -- the only one of the two that can speak plain CONNECT, so the
    # TCP tunnel's independent coverage lives entirely in its half.
    #
    # Linux only: this is about the protocol on the wire, not about the host, and
    # the platform matrix is already covered by the `test` job above.
    name: interop (masque-go + aioquic)
    runs-on: ubuntu-latest
    env:
      # Loopback, so nothing outside the runner can reach this server for the
      # minute it lives. The port is arbitrary and unprivileged.
      VOLTO_ADDR: 127.0.0.1:14443
      # The name in the generated certificate. The client validates against it.
      VOLTO_SNI: localhost
      # Authentication is on, exactly as in a real deployment: masque-go can set
      # `Proxy-Authorization`, so the credentialed path — the one Surge uses on
      # every CONNECT — is what gets exercised, and the suite also asserts that
      # omitting credentials draws a 407. These are not secrets: they exist for
      # the lifetime of one job, on a loopback socket.
      VOLTO_USER: interop
      VOLTO_PASSWORD: interop-password-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Single source of truth for the Go version: the module's own go.mod.
          go-version-file: tests/interop/go.mod
          cache-dependency-path: tests/interop/go.sum
      - run: cargo build --locked

      # The certificate and the configuration come from tests/interop/serve.sh,
      # which ./run-local.sh calls too: that script claims to mirror this job,
      # and sharing the fixture is what makes the claim enforced rather than
      # asserted. A helper binary would be one more thing to keep compiling;
      # openssl is already on the runner and is what
      # `script/install-selfsigned.sh` uses.
      - name: Prepare the certificate and configuration
        run: tests/interop/serve.sh prepare "$PWD/interop"

      # Started here rather than in the fixture: a step is its own process, so
      # the server has to outlive the one that starts it and is reaped by the
      # `if: always()` step at the end through this pid file. run-local.sh is
      # one shell throughout and uses an EXIT trap instead.
      - name: Start the server
        run: |
          nohup ./target/debug/volto --config interop/config.toml \
            > interop/server.log 2>&1 &
          echo $! > interop/server.pid
          tests/interop/serve.sh wait interop/server.log "$(cat interop/server.pid)"

      - name: Drive it with masque-go
        working-directory: tests/interop
        env:
          VOLTO_CERT: ${{ github.workspace }}/interop/cert.pem
        # `-count=1` defeats Go's test result cache, which keys on the binary and
        # the environment and knows nothing about the server on the other end —
        # a restored cache entry would let this job pass without a single packet
        # being sent. The timeout is the backstop for a tunnel that hangs instead
        # of failing: `go test` then panics and the job fails.
        run: go test -v -count=1 -timeout 120s ./...

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/interop/aioquic/requirements.txt

      - name: Drive it with aioquic
        env:
          VOLTO_CERT: ${{ github.workspace }}/interop/cert.pem
        # The same server instance: every test opens its own QUIC connection, so
        # nothing carries over from the Go half. The suite is its own runner and
        # exits non-zero on the first assertion it cannot make.
        run: |
          pip install -r tests/interop/aioquic/requirements.txt
          python tests/interop/aioquic/interop_test.py

      # Runs even when an earlier step failed, including before the server was
      # started, so neither file is assumed to exist. The log is the half of a
      # failure the Go client cannot see: it says which request was refused and
      # why, where the client only knows a packet never came back.
      - name: Stop the server and show its log
        if: always()
        run: |
          if [ -f interop/server.pid ]; then
            kill "$(cat interop/server.pid)" 2>/dev/null || true
          fi
          if [ -f interop/server.log ]; then
            cat interop/server.log
          fi
