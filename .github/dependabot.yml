# Dependabot only touches registry dependencies and action versions.
#
# Four ecosystems are watched below: the crates in `Cargo.toml`, the pinned
# GitHub Actions, and the Go and Python modules the `interop` job drives the
# server with. The last two matter as much as the first: masque-go and aioquic
# are the independent implementations this project is checked against, so an
# unwatched copy of either would quietly age into agreeing with us by being too
# old to disagree.
#
# The `[patch.crates-io]` entry redirecting `quinn-proto` at a git commit is
# outside its reach: Dependabot ignores git dependencies. It is meant to be
# temporary — the commit is moved by hand until an upstream 0.11.x release
# carries the MTU black-hole detector fix, at which point the whole stanza goes
# away. Both the patch and its exit condition are documented in
# docs/architecture.md. With the three ecosystems below covered, it is the only
# dependency left in the tree that Dependabot cannot see.
#
# Every dependency PR must pass the full CI suite, on Linux and macOS, before it
# is merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Actions are pinned to commit SHAs with the release in a trailing comment;
  # Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The masque-go client behind the `interop` job. This go.mod is also where
  # that job reads its Go toolchain version from (`go-version-file:
  # tests/interop/go.mod` in ci.yml), so a bump of the `go` directive is picked
  # up by the runner too, not just the module requirements.
  - package-ecosystem: gomod
    directory: "/tests/interop"
    schedule:
      interval: weekly

  # The aioquic client behind the same job's Python half, pinned in full in
  # requirements.txt for the same reason.
  - package-ecosystem: pip
    directory: "/tests/interop/aioquic"
    schedule:
      interval: weekly
