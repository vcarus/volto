# Dependabot only touches registry dependencies, action versions and the
# release build images.
#
# Six entries are watched below: the crates in `Cargo.toml`, the crates in
# `fuzz/Cargo.toml` (its own workspace, so its own entry -- one manifest per
# `directory`), the pinned GitHub Actions, the images the release binaries are
# built in, and the Go and Python modules the `interop` job drives the server
# with. The last two matter as much as the first: masque-go and aioquic are
# the independent implementations this project is checked against, so an
# unwatched copy of either would quietly age into agreeing with us by being
# too old to disagree.
#
# One thing stays outside its reach: transitive-only crates. Dependabot proposes
# bumps for the dependencies a manifest names, never for the ones they pull in,
# so the lockfiles are refreshed by hand (`cargo update`, root and fuzz/) before
# a release.
#
# Every dependency PR must pass the full CI suite, on Linux and macOS, before it
# is merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The fuzz crate is a separate cargo workspace (cargo-fuzz convention) with
  # its own committed lockfile, so the root entry does not see it.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly

  # Actions are pinned to commit SHAs with the release in a trailing comment;
  # Dependabot updates the SHA and the comment together.
  # `/` is the workflows; the second entry is the composite action they
  # share, which pins an action of its own and is not found under `/`.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/cmake-libclang"
    schedule:
      interval: weekly

  # The cross images the release binaries are built in (Cross.toml), each
  # named by tag and digest in a Dockerfile of its own. A new tag, or a new
  # digest behind the same tag, arrives as a pull request, and cross.yml runs
  # on it. The two targets move together, so one group holds both.
  - package-ecosystem: docker
    directory: "/.github/cross"
    schedule:
      interval: weekly
    groups:
      cross-images:
        patterns:
          - "*"

  # The masque-go client behind the `interop` job. This go.mod is also where
  # that job reads its Go toolchain version from (`go-version-file:
  # tests/interop/go.mod` in ci.yml), so a bump of the `go` directive is picked
  # up by the runner too, not just the module requirements.
  - package-ecosystem: gomod
    directory: "/tests/interop"
    schedule:
      interval: weekly

  # The aioquic client behind the same job's Python half, pinned in full in
  # requirements.txt for the same reason.
  - package-ecosystem: pip
    directory: "/tests/interop/aioquic"
    schedule:
      interval: weekly
    # aioquic pins pylsqpack to one major, so the two cannot move in separate
    # PRs: on 2026-10-16 Dependabot opened one per package and pip could not
    # resolve either (#31, #32). One PR for the whole client keeps the pins
    # resolvable together.
    groups:
      interop-client:
        patterns:
          - "*"
