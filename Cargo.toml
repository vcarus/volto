[package]
name = "volto"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
description = "MASQUE proxy server (HTTP/3 CONNECT + CONNECT-UDP)"
repository = "https://github.com/vcarus/volto"
license = "MIT"
# The h3/h3-quinn git pins below cannot be expressed on crates.io, and this is a
# server rather than a library anyone would depend on.
publish = false

[dependencies]
# `h3`/`h3-quinn` are pinned to a git revision on purpose: the published 0.0.x
# releases lack the fixes in #331 (h3-quinn panic), #340 (datagram Quarter Stream
# ID), #344 (unbounded memory on slow consumers) and #357. Keep this rev and
# `Cargo.lock` in sync; bump both deliberately.
#
# NOTE: `h3-datagram` is intentionally *not* a dependency. Its 0.0.2 release
# encodes the Quarter Stream ID as zero, which misroutes every UDP session after
# the first on a connection. CONNECT-UDP (M2) will use quinn's native datagram
# API with our own varint codec instead.
# The `i-implement-...` feature is enabled only to read the peer's SETTINGS
# (RFC 9297 §2.1.1 forbids sending datagrams before the peer advertises
# SETTINGS_H3_DATAGRAM). It exposes no extra behaviour, only extra visibility,
# and the rev is pinned, so its instability is frozen.
h3 = { git = "https://github.com/hyperium/h3", rev = "b986a537ddb1ccdd1eca3685b883cf7549ff7698", features = [
    "i-implement-a-third-party-backend-and-opt-into-breaking-changes",
] }
h3-quinn = { git = "https://github.com/hyperium/h3", rev = "b986a537ddb1ccdd1eca3685b883cf7549ff7698" }

quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "bloom",
    "log",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "logging",
] }
# PEM parsing comes from rustls' own `pki_types::pem::PemObject` (rustls-pki-types
# >= 1.9); `rustls-pemfile` is unmaintained (RUSTSEC-2025-0134) and was only a
# wrapper around the same code.

tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "signal",
    "time",
    "sync",
] }

bytes = "1"
http = "1"
percent-encoding = "2"
# Constant-time credential comparison (RFC 7617 secrets must not be compared with
# a short-circuiting `==`). Already in the tree via rustls; `ConstantTimeEq` is
# the only item used.
subtle = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

# Raw syscalls with no portable equivalent in std: getrlimit(RLIMIT_NOFILE) for
# the startup fd-budget check (POSIX, both hosts) and IP_MTU_DISCOVER for the DF
# bit (Linux only, behind cfg in net.rs).
libc = "0.2"

# SO_RCVBUF/SO_SNDBUF on the endpoint's UDP socket (D56). Already in the tree via
# quinn-udp, so this is a direct dependency on a crate that was being compiled
# anyway. Used directly rather than through `quinn::udp::UdpSocketState`, whose
# setter is a `&self` method: reaching it would mean constructing a
# `UdpSocketState` -- a whole batch of setsockopts -- purely to call the same
# one-line `socket2::SockRef` wrapper quinn repeats when it wraps the socket.
socket2 = "0.6"

[dev-dependencies]
rcgen = "0.14"
# Property tests (`tests/it_props.rs`) over the three hand-rolled parsers that
# read untrusted bytes. A stand-in for coverage-guided fuzzing: `cargo fuzz`
# needs a nightly toolchain, and the dev host has stable Rust only.
proptest = "1"

# TEMPORARY. quinn-proto's MTU black-hole detector reads an ordinary congestion
# loss burst during a bulk transfer as the path having stopped carrying the
# current MTU: the connection drops back to the 1200-byte floor, and on the
# 0.11.x branch every further loss burst at the floor re-triggers the detector
# and pushes the re-probe out again, so the MTU stays there for the whole
# download. That branch is also missing two comparison fixes that upstream
# landed on `main` only. Until a quinn-proto 0.11.x release carries all three,
# we carry them ourselves -- a fork of the `quinn-proto-0.11.17` tag with three
# commits on top, every one of them in `quinn-proto/src/connection/mtud.rs`:
#
#   7108a315  Fix some comparisons in the black hole detector    (upstream #2400)
#   0f457685  Relax MTU discovery state assertion                (upstream #2400)
#   3f35067f  proto: treat an equal-size delivery as evidence against a
#             preceding loss burst                               (ours, #2792)
#
# Upstream refs: the bug is quinn-rs/quinn#2791, the fix quinn-rs/quinn#2792
# (open against `main`), and #2400 was never backported to 0.11.x.
#
# EXIT CONDITION: delete this stanza as soon as a quinn-proto 0.11.x release
# includes the fix, then `cargo update -p quinn-proto` and drop the CI audit
# workaround (see `.github/workflows/ci.yml`). Two blind spots until then, both
# spelled out in docs/architecture.md: Dependabot cannot bump a git patch, so
# the fork is rebased by hand; and cargo-audit ignores lockfile entries whose
# source is not the default registry, which the `audit` job works around by
# rewriting that one source line back to the registry before it scans -- the
# fork's version *is* the upstream tag, so advisories filed against quinn-proto
# 0.11.17 apply to us unchanged.
[patch.crates-io]
quinn-proto = { git = "https://github.com/vcarus/quinn", rev = "3f35067fd236e224edf82d8b03a810a9b1d34a3e" }
