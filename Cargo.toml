[package]
name = "volto"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "MASQUE proxy server (HTTP/3 CONNECT + CONNECT-UDP)"
repository = "https://github.com/vcarus/volto"
documentation = "https://vcarus.github.io/volto/"
license = "MIT"
# The `[patch.crates-io]` stanza below cannot be expressed on crates.io, and this
# is a server rather than a library anyone would depend on.
publish = false

[dependencies]
# `bloom` is a behaviour switch, not a passive dependency, so it is listed here
# deliberately: it selects what quinn-proto's `ValidationTokenConfig` defaults
# to. With it the server sends 2 NEW_TOKEN frames to every client whose path it
# has validated and keeps a `BloomTokenLog` of the tokens that come back, so a
# returning client skips address validation and a replayed token is still
# caught. Without it the log is `NoneTokenLog` and `sent` is 0: no NEW_TOKEN
# frames at all, and every returning client pays the extra round trip again.
#
# Its memory is bounded rather than growing with traffic, which is worth knowing
# before reading a heap profile: `BloomTokenLog::default` is
# `new_expected_items(DEFAULT_MAX_BYTES, DEFAULT_EXPECTED_HITS)`, where
# `DEFAULT_MAX_BYTES` is `10 << 20` split evenly between the two filters it
# keeps for the two token-expiry periods that can be live at once (the default
# token lifetime being two weeks). It also starts as a hash set and becomes a
# bloom filter only once that set grows, so an early profile shows far less than
# the bound and a later one shows the bound. Neither is a leak.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
    "bloom",
    "log",
] }
# The crypto backend is aws-lc-rs rather than ring (D102). It is what rustls
# enables by default upstream and the only provider that carries ML-KEM, so a
# hybrid key exchange becomes a client-side question rather than a server
# rebuild -- see D101. `prefer-post-quantum` is deliberately *not* enabled: it
# only reorders the key exchange list, and a server picks from what the client
# offers rather than proposing an order of its own, so enabling it would change
# nothing here. X25519MLKEM768 is in `DEFAULT_KX_GROUPS` either way.
#
# `default-features = false` also keeps `tls12` off, which QUIC requires anyway;
# with it off both providers reduce to the same three TLS 1.3 suites.
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
    "logging",
] }
# PEM parsing comes from rustls' own `pki_types::pem::PemObject` (rustls-pki-types
# >= 1.9); `rustls-pemfile` is unmaintained (RUSTSEC-2025-0134) and was only a
# wrapper around the same code.

tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "signal",
    "time",
    "sync",
] }

bytes = "1"
percent-encoding = "2"
# Constant-time credential comparison (RFC 7617 secrets must not be compared with
# a short-circuiting `==`). Already in the tree via rustls; `ConstantTimeEq` is
# the only item used.
subtle = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

# Safe wrappers around the syscalls that have no portable equivalent in std:
# getrlimit(RLIMIT_NOFILE) for the startup fd-budget check (POSIX, both hosts)
# and IP_MTU_DISCOVER for the DF bit (Linux only, behind cfg in net.rs). Both
# used to be hand-written `libc` FFI, and replacing them is what lets `src/`
# carry `#![forbid(unsafe_code)]`.
#
# It is pure Rust with no C to build -- on Linux it issues the syscalls itself
# rather than linking libc's -- so it adds nothing to the musl cross-build that
# release.yml and cross.yml run. It was already being compiled here anyway, as a
# dev dependency: proptest -> tempfile -> rustix.
#
# `net` is the sockopt module and `process` is getrlimit/setrlimit; `std` is
# rustix's own default and is spelled out because the default set is off.
rustix = { version = "1", default-features = false, features = [
    "net",
    "process",
    "std",
] }

# Errno constants only -- `EMFILE`, `ENOBUFS` and their neighbours, which
# `tunnel` matches on to tell a per-target failure from a process-wide one.
# There are no `libc` calls left in `src/`; the one remaining call in the tree is
# `getrusage` in `tests/it_bench.rs`, which rustix does not wrap.
libc = "0.2"

# SO_RCVBUF/SO_SNDBUF on the endpoint's UDP socket (D56). Already in the tree via
# quinn-udp, so this is a direct dependency on a crate that was being compiled
# anyway. Used directly rather than through `quinn::udp::UdpSocketState`, whose
# setter is a `&self` method: reaching it would mean constructing a
# `UdpSocketState` -- a whole batch of setsockopts -- purely to call the same
# one-line `socket2::SockRef` wrapper quinn repeats when it wraps the socket.
socket2 = "0.6"

# The volto half of the QPACK/Huffman differential oracle: a filter that turns
# bytes into this server's verdict about them, so that `tests/interop/difforacle`
# can put the same bytes through an independent decoder and compare. An example
# rather than a test binary because it is driven from outside `cargo test`, and
# it lives beside its driver rather than in an `examples/` directory because it
# is not an example of anything -- see that directory's README.
[[example]]
name = "diff_oracle"
path = "tests/interop/difforacle/oracle.rs"

# Test binaries that hold no test `cargo test` can run: every test in the two
# targets below is `#[ignore]`d, because each one is a deliberate run an
# operator starts by hand and reads the output of, not an assertion a suite can
# make. `it_bench` measures throughput, packet rates and churn over minutes and
# wants `--release`; `it_resolver_pool` binds `127.0.0.1:53` and rewrites
# `/etc/resolv.conf`, so it refuses to run outside a container it may modify.
# Both are still worth compiling and still worth running -- just never as part
# of a suite, which is what this feature says out loud. `cargo test` was already
# linking both (`it_bench` pulls in the whole harness) to run nothing at all.
#
# Not "bench": `it_resolver_pool` is a fault injection, not a measurement, and
# what the two have in common is the operator, not the benchmark.
#
# Forgetting the flag cannot be mistaken for a green run. Cargo refuses the
# invocation rather than filtering the target away:
#
#     $ cargo test --test it_bench
#     error: target `it_bench` in package `volto` requires the features:
#     `operator-runs`
#     Consider enabling them by passing, e.g., `--features="operator-runs"`
#
# and exits non-zero. A plain `cargo test` simply does not build them, which is
# the point of the gate; what would be dangerous is `--test <name>` reporting a
# green run of nothing, and it does not.
#
# `cargo clippy --all-targets --all-features -- -D warnings` in ci.yml keeps
# them typechecked and linted, so they cannot rot behind the flag.
#
# `tests/it_replay.rs` is deliberately not here even though its one heavy test
# is `#[ignore]`d too: it compiles `tests/replay/shape.rs` and `replay/netem.rs`,
# whose eleven unit tests do run in `cargo test`, and gating the binary would
# take those out of CI.
[features]
operator-runs = []

[[test]]
name = "it_bench"
path = "tests/it_bench.rs"
required-features = ["operator-runs"]

[[test]]
name = "it_resolver_pool"
path = "tests/it_resolver_pool.rs"
required-features = ["operator-runs"]

[dev-dependencies]
# Pinned to the same crypto backend as the server (D102). rcgen's default
# feature set is `crypto` + `pem` + `ring`, so the backend has to be selected by
# hand or ring comes back into the lockfile through the test certificates alone.
# `aws_lc_rs` implies `crypto`; `pem` is what `cert.pem()` and
# `signing_key.serialize_pem()` need. The generated key is unchanged either way:
# `KeyPair::generate` is ECDSA P-256 on both backends.
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }

# `test-util` gives the tests a clock they drive themselves: `start_paused` plus
# `tokio::time::advance` make "three hours pass" free and exact, which is the
# only way to assert a *deadline* rather than assert around one. Every budget
# test in this tree used to be a real sleep with a generous upper bound and an
# apology in its doc comment; those are now exact, and the cases that could not
# be written at all before -- a VM resumed after hours, where every armed timer
# fires in the same instant -- are written.
#
# A dev-dependency feature, so nothing in a release build changes. Even under
# `cargo test` the clock is the real one until a test pauses it: the feature
# routes `tokio::time::Instant::now` through a `Clock` whose unpaused answer is
# `std::time::Instant::now`. It pulls no new crate -- `test-util` enables only
# `rt`, `sync` and `time`, all of which this tree already asks for.
#
# What it does *not* reach is quinn: a paused clock moves tokio's timers, and
# the integration tests drive real UDP sockets whose packets no test advances
# the clock for. So the paused-clock tests are unit tests over this crate's own
# timers, and the on-wire deadlines stay pinned by the real-time integration
# tests that already cover them (`it_hostile`, `it_handshake`, `it_tcp`).
tokio = { version = "1", features = ["test-util"] }
# Property tests over the parsers that read untrusted bytes, and the CI-side
# half of a two-part arrangement: `cargo fuzz` needs a nightly toolchain, and
# the dev host has stable Rust only, so coverage-guided fuzzing lives in the
# `fuzz/` crate and runs on demand in a Linux container (see fuzz/README.md)
# while these run everywhere on stable. `tests/it_props.rs` covers the datagram
# and capsule decoders and the CONNECT-UDP path template; the rest are unit
# tests next to the code, in `src/h3/frame.rs` (the frame decoder, the SETTINGS
# parser) and `src/h3/qpack.rs` (the field-section decoder, which is also what
# reaches the Huffman decoder).
proptest = "1"

# Debug info narrowed to what this tree actually reads back.
#
# `line-tables-only` keeps the file and line of every frame, which is all a
# backtrace and `#[track_caller]` need -- and both are load-bearing here, since
# D66 shapes the asserting test helpers around `#[track_caller]` surviving to
# the poll that panics. What it drops is the variable, type and scope records a
# stepping debugger would want, and nothing in this workflow is one. The saving
# is link time and disk, and it is paid once per integration test binary in
# `tests/` -- of which there are enough for that multiplier to be the whole
# reason this setting is here (a number would be out of date within a week).
#
# `[profile.dev.package."*"] opt-level = 2` is the usual companion to this and
# is deliberately absent: optimising the dependency graph moves what the D86
# config-space property tests and `cargo mutants` are measuring, so it was
# weighed and declined rather than overlooked.
[profile.dev]
debug = "line-tables-only"

# Fat LTO with a single codegen unit, measured rather than assumed. On a Linux
# container on 2026-09-02, against the profile cargo ships by default, it took
# 11.5% off the stripped binary and 13-17% off the CPU cost of a 64-byte
# datagram each way -- the shape of the DNS queries Surge sends through the
# tunnel -- while MTU-sized datagrams and bulk TCP moved 2-8%, half of it inside
# the run-to-run noise. The encode path alone got 24-41% faster; the rest of
# the pipeline is syscalls and crypto, which LTO cannot reach. The price is the
# final link: about 8 s to about 65 s on an 8-thread host, paid only by the
# release workflows and by whoever rebuilds `it_bench` in release. `thin` was
# measured too and produced a *larger* binary, so it is not the middle option
# it looks like. Re-measure before keeping this if the per-packet allocation on
# the outbound datagram path ever goes away (D29): that allocation is much of
# what LTO is inlining today.
[profile.release]
lto = "fat"
codegen-units = 1

# TEMPORARY. quinn-proto's MTU black-hole detector reads an ordinary congestion
# loss burst during a bulk transfer as the path having stopped carrying the
# current MTU: the connection drops back to the 1200-byte floor, and on the
# 0.11.x branch every further loss burst at the floor re-triggers the detector
# and pushes the re-probe out again, so the MTU stays there for the whole
# download. That branch is also missing two comparison fixes that upstream
# landed on `main` only. Until a quinn-proto 0.11.x release carries all of
# these, we pin the `0.11.x` branch commit that carries them: `f650e0f` is the
# `quinn-proto-0.11.17` tag plus four fixes. Three are in
# `quinn-proto/src/connection/mtud.rs` (brought over by quinn-rs/quinn#2799):
#
#   Fix some comparisons in the black hole detector               (upstream #2400)
#   Relax MTU discovery state assertion                           (upstream #2400)
#   proto: treat an equal-size delivery as evidence against a
#          preceding loss burst                                   (#2792, ours)
#
# and the fourth is in `quinn-proto/src/connection/datagrams.rs` (#2806, ours):
# the outgoing-datagram eviction loop double-subtracted an evicted datagram's
# size from `payload_bytes`, so sustained eviction underflows the counter and
# panics inside `send_datagram` while the connection lock is held (#2805).
#
# Upstream refs: the MTU bug is quinn-rs/quinn#2791, the fix quinn-rs/quinn#2792
# (merged to `main`), and #2799 brought all three to `0.11.x` on 2026-08-20;
# the datagram bug is #2805, fixed on `0.11.x` by #2806 on 2026-08-29.
# Until 2026-08-20 the three MTU commits were served from a personal fork.
#
# EXIT CONDITION: delete this stanza as soon as a quinn-proto 0.11.x release
# includes the fix, then `cargo update -p quinn-proto` and drop the CI audit
# workaround (see `.github/workflows/ci.yml`). Two blind spots until then, both
# spelled out in docs/architecture.md: Dependabot cannot bump a git patch, so
# the rev is moved by hand; and cargo-audit ignores lockfile entries whose
# source is not the default registry, which the `audit` job works around by
# rewriting that one source line back to the registry before it scans -- the
# pinned commit's version *is* the upstream tag, so advisories filed against
# quinn-proto 0.11.17 apply to us unchanged.
[lints.rust]
# The default for every target in the package, tests and examples included: a
# new file that wants `unsafe` must argue for a file-level `allow` (today there
# are three, all in tests). `src/` is stricter still -- its two crate roots
# carry `forbid`, which an inner `allow` cannot weaken.
unsafe_code = "deny"

[patch.crates-io]
quinn-proto = { git = "https://github.com/quinn-rs/quinn", rev = "f650e0f213b01ea7bebd60023e5df7df65e5c2bd" }
