[package]
name = "volto"
version = "1.8.2"
edition = "2024"
rust-version = "1.100"
description = "MASQUE proxy server (HTTP/3 CONNECT + CONNECT-UDP)"
repository = "https://github.com/vcarus/volto"
documentation = "https://vcarus.github.io/volto/"
license = "MIT"
# A server rather than a library anyone would depend on, so there is nothing
# here for crates.io to carry.
publish = false

[dependencies]
# `bloom` is a behaviour switch, not a passive dependency, so it is listed here
# deliberately: it selects what quinn-proto's `ValidationTokenConfig` defaults
# to. With it the server sends 2 NEW_TOKEN frames to every client whose path it
# has validated and keeps a `BloomTokenLog` of the tokens that come back, so a
# returning client skips address validation and a replayed token is still
# caught. Without it the log is `NoneTokenLog` and `sent` is 0: no NEW_TOKEN
# frames at all, and every returning client pays the extra round trip again.
#
# Its memory is bounded rather than growing with traffic, which is worth knowing
# before reading a heap profile: `BloomTokenLog::default` is
# `new_expected_items(DEFAULT_MAX_BYTES, DEFAULT_EXPECTED_HITS)`, where
# `DEFAULT_MAX_BYTES` is `10 << 20` split evenly between the two filters it
# keeps for the two token-expiry periods that can be live at once (the default
# token lifetime being two weeks). It also starts as a hash set and becomes a
# bloom filter only once that set grows, so an early profile shows far less than
# the bound and a later one shows the bound. Neither is a leak.
#
# quinn's `log` feature is left out. It turns on `tracing/log` for the whole
# build, which adds to every `tracing` call site, quinn's and ours, a branch
# that writes a `log` record while no subscriber is installed. `main` installs
# one before the endpoint exists, so that branch never runs here.
#
# `aws-lc-rs` is quinn's crypto library without a TLS implementation (D102):
# the reset-token HMAC key of the default `EndpointConfig` and the token key of
# `ServerConfig::with_crypto` are aws-lc-rs's, and the TLS is volto's own
# provider (D115). No rustls feature is named here, so a release build
# compiles no rustls; `tests/it_release_assets.rs` holds that. The tests turn
# on `rustls-aws-lc-rs` through quinn's entry in `[dev-dependencies]`.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "aws-lc-rs",
    "bloom",
] }
# Named for what quinn does not re-export: `quinn_proto::RttEstimator`, which
# `Controller::on_ack` takes (src/congestion.rs), the crypto and transport
# parameter types the TLS provider implements (src/tls/awslc/), and the
# connection ID generator types `src/quic/cid.rs` wraps. quinn-proto is already
# in the tree as quinn's own dependency, so `Cargo.lock` gains this edge and no
# crate. Same requirement style as quinn, and no features of its own: quinn
# selects them.
quinn-proto = { version = "0.11", default-features = false }
# rustls is not the server's TLS (D115), and no release build compiles it. The
# PEM parser, the certificate checks and the `DnsName` rule come from the two
# crates below, which rustls calls for the same judgements. rustls is a
# dev-dependency, for the test clients.
#
# The certificate and key types and the PEM parser (`tls::load_certs`,
# `tls::load_key`, `EchKey::from_pem`), and the `DnsName` rule for a host name
# (`names::host_name`). This is the crate rustls re-exports as
# `rustls::pki_types`, so calling it directly runs the same code. `std` is
# what the PEM reader needs, and what rustls's own `std` feature turns on.
# `rustls-pemfile` is unmaintained (RUSTSEC-2025-0134) and was only a wrapper
# around the same PEM code (`pem::PemObject`, rustls-pki-types >= 1.9).
rustls-pki-types = { version = "1.16", default-features = false, features = [
    "std",
] }
# webpki's parse of the leaf certificate at startup, on reload and in
# `--check-config` (`tls::check_leaf`), and the certificate name check behind
# the `expected_sni` warning (`tls::names_not_covered`). rustls's
# `ParsedCertificate::try_from` and `client::verify_server_name` are one-line
# wrappers over `EndEntityCert::try_from` and
# `EndEntityCert::verify_is_valid_for_subject_name`, which are called directly.
# Neither call checks a signature, so no crypto backend feature is needed. `std`
# matches what rustls's `std` feature turns on, and it implies `alloc`, under
# which webpki keeps the names in a name-mismatch error.
rustls-webpki = { version = "0.103", default-features = false, features = [
    "std",
] }

# The server's TLS (D115): volto's own quinn crypto provider in `src/tls/awslc/`
# runs the handshake on AWS-LC's libssl, which has server-side ECH and
# BoringSSL's QUIC interface. It is the same `aws-lc-sys` build that backs
# aws-lc-rs (D102), so naming it here adds edges and features, not a second
# copy of AWS-LC. `ssl` is what builds and binds libssl.
# It implies `bindgen` and `all-bindings`, so the bindings are generated at
# build time with libclang instead of taken from the pregenerated crypto-only
# files, and the build goes through cmake: every builder now needs cmake and
# libclang (`docs/deployment.md`). bindgen 0.73.2 and the `prettyplease` it
# pulls must build against the same syn: bindgen accepts syn 2 or 3,
# `prettyplease` 0.3 needs syn 3, and with bindgen on syn 2 beside
# `prettyplease` 0.3 bindgen fails to compile. `Cargo.lock` has both on syn 3
# since 2026-11-20. After a `cargo update`, read bindgen's syn edge in the
# lock diff; if it went back to syn 2 while `prettyplease` stayed on 0.3, run
# `cargo update -p prettyplease --precise 0.2.37`.
aws-lc-sys = { version = "0.47", default-features = false, features = ["ssl"] }
# Packet protection, header protection and the Initial and Retry keys of the
# provider (`src/tls/awslc/keys.rs`) are safe code over aws-lc-rs's AEAD, HKDF
# and QUIC header protection, the same primitives rustls's QUIC keys use. Already
# in the tree through quinn's `aws-lc-rs` feature; this is a direct edge to it.
aws-lc-rs = { version = "1.19", default-features = false, features = [
    "aws-lc-sys",
] }
# Clears the TLS traffic secrets and the ECH private key from memory when the
# provider drops them, as rustls does with its own secrets. Already in the tree
# through aws-lc-rs.
zeroize = "1"

# 1.50 is the first release with `TcpStream::set_zero_linger`, which
# `tunnel::tcp` uses to reset a target connection.
tokio = { version = "1.50", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "signal",
    "time",
    "sync",
] }

bytes = "1"
percent-encoding = "2"
# Constant-time credential comparison (RFC 7617 secrets must not be compared with
# a short-circuiting `==`). `ConstantTimeEq` is the only item used.
subtle = "2"
serde = { version = "1", features = ["derive"] }
# Read only: the configuration is parsed and never written, so the default
# `display` feature and its `toml_writer` crate are left out.
toml = { version = "1.1", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
# The default set less `tracing-log`, whose `LogTracer` would forward `log`
# records into `tracing`. Nothing the server runs emits one: quinn's `log`
# feature is off, the server compiles no rustls, and `log` is left in the
# graph only by bindgen at build time.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "smallvec",
    "std",
] }
anyhow = "1"

# Safe wrappers around the syscalls that have no portable equivalent in std:
# getrlimit(RLIMIT_NOFILE) for the startup fd-budget check (POSIX, both hosts)
# and IP_MTU_DISCOVER for the DF bit (Linux only, behind cfg in net.rs). Both
# used to be hand-written `libc` FFI, and replacing them is what keeps `unsafe`
# out of `src/` apart from the TLS binding (`src/lib.rs` says which module).
#
# It is pure Rust with no C to build -- on Linux it issues the syscalls itself
# rather than linking libc's -- so it adds nothing to the musl cross-build that
# release.yml and cross.yml run.
#
# `net` is the sockopt module, `process` is getrlimit/setrlimit, and `system` is
# the `uname` that `--diagnostics` prints; `std` is rustix's own default and is
# spelled out because the default set is off.
#
# It also supplies the errno values `tunnel` matches on (`rustix::io::Errno`) to
# tell a per-target failure from a process-wide one, so `src/` names `libc`
# nowhere.
rustix = { version = "1", default-features = false, features = [
    "net",
    "process",
    "std",
    "system",
] }

# SO_RCVBUF/SO_SNDBUF on the endpoint's UDP socket (D56). Already in the tree via
# quinn-udp, so this is a direct dependency on a crate that was being compiled
# anyway. Used directly rather than through `quinn::udp::UdpSocketState`, whose
# setter is a `&self` method: reaching it would mean constructing a
# `UdpSocketState` -- a whole batch of setsockopts -- purely to call the same
# one-line `socket2::SockRef` wrapper quinn repeats when it wraps the socket.
socket2 = "0.6"

# The global allocator of the musl builds, installed in `src/main.rs` through
# `src/alloc.rs`. The release binaries are static musl, which `tests/it_bench.rs`
# measured costlier in CPU than `x86_64-unknown-linux-gnu` with identical
# allocation counts, so the gap is libc, and musl's `malloc` is the first part
# of it to replace. The measurement is in the commit that added this.
#
# musl only: glibc's allocator already keeps per-thread caches, and the gnu,
# macOS and test builds stay on `std::alloc::System`, so mimalloc is not
# compiled there at all. The cost is C code that `libmimalloc-sys` builds with
# `cc`. The musl cross-builds in release.yml and cross.yml already need a C
# toolchain for aws-lc-rs, so they need nothing new. `default-features = false`
# keeps the feature set empty, which builds the mimalloc v3 C sources the sys
# crate vendors. `secure` (guard pages and encrypted free lists) stays off. It
# adds CPU cost, and CPU cost is the reason this dependency exists.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

# The volto half of the QPACK/Huffman differential oracle: a filter that turns
# bytes into this server's verdict about them, so that `tests/interop/difforacle`
# can put the same bytes through an independent decoder and compare. An example
# rather than a test binary because it is driven from outside `cargo test`, and
# it lives beside its driver rather than in an `examples/` directory because it
# is not an example of anything -- see that directory's README.
[[example]]
name = "diff_oracle"
path = "tests/interop/difforacle/oracle.rs"

# Test binaries that hold no test `cargo test` can run: every test in the two
# targets below is `#[ignore]`d, because each one is a deliberate run an
# operator starts by hand and reads the output of, not an assertion a suite can
# make. `it_bench` measures throughput, packet rates and churn over minutes and
# wants `--release`; `it_resolver_pool` binds `127.0.0.1:53` and rewrites
# `/etc/resolv.conf`, so it refuses to run outside a container it may modify.
# Both are still worth compiling and still worth running -- just never as part
# of a suite, which is what this feature says out loud. `cargo test` was already
# linking both (`it_bench` pulls in the whole harness) to run nothing at all.
#
# Not "bench": `it_resolver_pool` is a fault injection, not a measurement, and
# what the two have in common is the operator, not the benchmark.
#
# Forgetting the flag cannot be mistaken for a green run. Cargo refuses the
# invocation rather than filtering the target away:
#
#     $ cargo test --test it_bench
#     error: target `it_bench` in package `volto` requires the features:
#     `operator-runs`
#     Consider enabling them by passing, e.g., `--features="operator-runs"`
#
# and exits non-zero. A plain `cargo test` simply does not build them, which is
# the point of the gate; what would be dangerous is `--test <name>` reporting a
# green run of nothing, and it does not.
#
# `cargo clippy --all-targets --all-features -- -D warnings` in ci.yml keeps
# them typechecked and linted, so they cannot rot behind the flag.
#
# `tests/it_replay.rs` is deliberately not here even though its one heavy test
# is `#[ignore]`d too: it compiles `tests/replay/shape.rs` and `replay/netem.rs`,
# whose eleven unit tests do run in `cargo test`, and gating the binary would
# take those out of CI.
[features]
operator-runs = []

[[test]]
name = "it_bench"
path = "tests/it_bench.rs"
required-features = ["operator-runs"]

[[test]]
name = "it_resolver_pool"
path = "tests/it_resolver_pool.rs"
required-features = ["operator-runs"]

[dev-dependencies]
# The TLS of every test client, and of the test servers that are quinn's and
# not volto's. rustls is a different TLS implementation from the server's
# AWS-LC libssl (D115), so the two ends of each test run different code.
#
# Its crypto backend is aws-lc-rs rather than ring (D102). It is what rustls
# enables by default upstream and the only rustls provider that carries ML-KEM,
# which the test clients need to offer X25519MLKEM768 the way Surge does.
#
# `prefer-post-quantum` is deliberately *not* enabled. It only reorders the
# provider's `DEFAULT_KX_GROUPS`, and since D115 no handshake of the server reads
# that list: the server's groups are `GROUPS` in `src/tls/awslc/mod.rs`, and
# libssl takes the first of them in the client's own order. What the feature
# would change is the test suite: every rustls client on the default provider
# would offer X25519MLKEM768 first and send its key share, where it now offers
# X25519 first. A test that wants the post-quantum order asks for it (`pq_first`
# in `src/tls/awslc/tests.rs`), and `nameless_crypto` in `tests/common`, which
# builds the gate tests' Initial packets, never reaches a key exchange.
# X25519MLKEM768 is in `DEFAULT_KX_GROUPS` either way.
#
# `default-features = false` also keeps `tls12` off, which QUIC requires anyway;
# with it off both providers reduce to the same three TLS 1.3 suites.
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
] }
# quinn's rustls provider (`quinn::crypto::rustls`), which the test clients and
# the rustls test servers run on. A dev-dependency feature, so Cargo turns it
# on only for the targets that need dev-dependencies (tests, examples,
# benches). `cargo build` does not build those, and its quinn has the three
# features above and no TLS. The library compiles from the same source either
# way: nothing in `src/` outside `#[cfg(test)]` names `quinn::crypto::rustls`.
quinn = { version = "0.11", default-features = false, features = [
    "rustls-aws-lc-rs",
] }
# Pinned to the same crypto backend as the server (D102). rcgen's default
# feature set is `crypto` + `pem` + `ring`, so the backend has to be selected by
# hand or ring is compiled into the test build for the test certificates alone.
# `aws_lc_rs` implies `crypto`; `pem` is what `cert.pem()` and
# `signing_key.serialize_pem()` need. The generated key is unchanged either way:
# `KeyPair::generate` is ECDSA P-256 on both backends.
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }

# `test-util` gives the tests a clock they drive themselves: `start_paused` plus
# `tokio::time::advance` make "three hours pass" free and exact, which is the
# only way to assert a *deadline* rather than assert around one. Every budget
# test in this tree used to be a real sleep with a generous upper bound and an
# apology in its doc comment; those are now exact, and the cases that could not
# be written at all before -- a VM resumed after hours, where every armed timer
# fires in the same instant -- are written.
#
# A dev-dependency feature, so nothing in a release build changes. Even under
# `cargo test` the clock is the real one until a test pauses it: the feature
# routes `tokio::time::Instant::now` through a `Clock` whose unpaused answer is
# `std::time::Instant::now`. It pulls no new crate -- `test-util` enables only
# `rt`, `sync` and `time`, all of which this tree already asks for.
#
# What it does *not* reach is quinn: a paused clock moves tokio's timers, and
# the integration tests drive real UDP sockets whose packets no test advances
# the clock for. So the paused-clock tests are unit tests over this crate's own
# timers, and the on-wire deadlines stay pinned by the real-time integration
# tests that already cover them (`it_hostile`, `it_handshake`, `it_tcp`).
tokio = { version = "1.50", features = ["test-util"] }
# `getrusage` in `tests/it_bench.rs`, the one raw libc call in the tree: rustix
# does not wrap it.
libc = "0.2"
# Property tests over the parsers that read untrusted bytes, and the CI-side
# half of a two-part arrangement: `cargo fuzz` needs a nightly toolchain, and
# the dev host has stable Rust only, so coverage-guided fuzzing lives in the
# `fuzz/` crate and runs on demand in a Linux container (see fuzz/README.md)
# while these run everywhere on stable. `tests/it_props.rs` covers the datagram
# and capsule decoders and the CONNECT-UDP path template; the rest are unit
# tests next to the code, in `src/h3/frame.rs` (the frame decoder, the SETTINGS
# parser) and `src/h3/qpack.rs` (the field-section decoder, which is also what
# reaches the Huffman decoder).
proptest = "1"

# Debug info narrowed to what this tree actually reads back.
#
# `line-tables-only` keeps the file and line of every frame, which is all a
# backtrace and `#[track_caller]` need -- and both are load-bearing here, since
# D66 shapes the asserting test helpers around `#[track_caller]` surviving to
# the poll that panics. What it drops is the variable, type and scope records a
# stepping debugger would want, and nothing in this workflow is one. The saving
# is link time and disk, and it is paid once per integration test binary in
# `tests/` -- of which there are enough for that multiplier to be the whole
# reason this setting is here (a number would be out of date within a week).
#
# `[profile.dev.package."*"] opt-level = 2` is the usual companion to this and
# is deliberately absent: optimising the dependency graph moves what the D86
# config-space property tests and `cargo mutants` are measuring, so it was
# weighed and declined rather than overlooked.
[profile.dev]
debug = "line-tables-only"

# Fat LTO with a single codegen unit, measured rather than assumed: against the
# profile cargo ships by default it made the binary smaller and small datagrams,
# the shape of the DNS queries Surge sends through the tunnel, cheaper in CPU.
# The price is a much longer final link, paid only by the release workflows and
# by whoever rebuilds `it_bench` in release. `thin` produced a *larger* binary
# than fat, so it is not the middle option it looks like. Re-measure before
# keeping this if the per-packet allocation on the outbound datagram path ever
# goes away (D29): that allocation is much of what LTO is inlining today.
[profile.release]
lto = "fat"
codegen-units = 1
# Stripped by the profile rather than by a strip step in the release workflow,
# because such a step does nothing for the cross-built aarch64 target, whose
# asset then ships its DWARF and symbol tables. `strip = true` goes through
# rustc and the linker, so it holds for every target the same way. `debug`
# stays at the profile default: line tables here disable Cargo's default
# debuginfo strip and set `DEBUG=true` for build scripts, which makes `cc`
# compile aws-lc with `-g`.
strip = true

# Integer overflow panics in volto's own code in release builds too, as it
# already does in debug builds and so in every test run. Without this, an
# unsigned subtraction that underflows wraps silently, and a bound computed
# from it (a buffer budget, a remaining length) becomes a very large number
# that lets the check it feeds pass. Safe Rust cannot turn that into memory
# corruption, but it can turn a bounded buffer into an unbounded one. With the
# check, the overflow panics. With the default `panic = "unwind"`, a panic in a
# task volto spawns for a connection or a tunnel ends that one task and not the
# process. A panic in code quinn's own driver calls is different. The socket
# gate (`src/gate.rs`) runs under quinn's endpoint driver, and a panic there
# aborts the process: the driver unwraps its poisoned mutex in its destructor
# while the panic unwinds (quinn 0.11.12 `src/endpoint.rs`, `Drop for
# EndpointDriver`). `Expected::memory` in `src/gate.rs` gives the whole chain.
#
# Scoped to this package. The dependencies keep the profile default (off):
# their hot paths (quinn-proto, aws-lc-rs) are not ours to slow, and aws-lc is C,
# which this setting does not reach. `as` casts are not checked by it either;
# those are covered by `clippy::as_conversions`, which every cast in `src/`
# allows explicitly with its own argument. Cost measured with `it_bench` on the
# musl target before this was committed; see the commit message.
#
# `strip = true` is repeated here because this table needs it. With a package
# table present, cargo 1.100 passes this package `-C strip=debuginfo`, the
# default of a profile that sets no `strip`, and not the `strip = true` of
# `[profile.release]`; the dependencies still get `-C strip=symbols`. The
# binary is linked as this package's unit, so without the line below it keeps
# its `.symtab`, which is what cross.yml's "The built binary is stripped" step
# reported on the first pull request that carried this table.
[profile.release.package.volto]
overflow-checks = true
strip = true

[lints.rust]
# The default for every target in the package, tests and examples included: a
# new file that wants `unsafe` must argue for a file-level `allow` (today there
# are three in tests). In `src/`, `main.rs` carries `forbid`, which an inner
# `allow` cannot weaken, and `lib.rs` carries `deny` with one module-level
# `allow`, on the libssl binding `tls::awslc` (D115); `src/lib.rs` says why.
unsafe_code = "deny"

[lints.clippy]
# The same shape as `unsafe_code` above: denied for every target in the package,
# and a site that wants one argues for its own `allow` with a reason beside it.
# A numeric `as` narrows silently -- `65536u32 as u16` is 0 and nothing says so
# -- and the parser modules take their lengths from a peer, so the conversion
# that has to be checked is exactly the one this forbids writing without
# thinking. `From`/`Into` where the widening is lossless, `try_from` with a
# stated fallback where the narrowing is real, and a per-site allow only where
# the value is already proven in range by the code above it.
as_conversions = "deny"

# Cargo's own lints, read by cargo 1.100 and newer, which the MSRV guarantees.
# `unused_dependencies` reports a `[dependencies]` entry that no target of the
# package uses. A warning rather than an error, because cargo judges it for the
# target being built and `mimalloc` is declared for musl alone.
[lints.cargo]
unused_dependencies = "warn"
