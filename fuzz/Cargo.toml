[package]
name = "volto-fuzz"
version = "0.0.0"
publish = false
# Edition 2024, as the root moved to in 93c043d, so a target cannot quietly keep
# an idiom `src/` has already left behind. Migrating changed no source: `cargo
# fix --edition` rewrote nothing, and the one `tail-expr-drop-order` warning it
# raised (in `frame`) is a `Bytes` refcount landing a few lines later, with no
# lock or channel behind it.
edition = "2024"

# A resolver input, not a support claim. Edition 2024 implies resolver 3, which
# is MSRV-aware, and with no `rust-version` here that resolver floors on
# whatever toolchain happens to be installed -- so a regeneration on a newer
# host could pull a dependency version the root's own 1.95 floor would have
# refused, and this workspace would stop fuzzing the graph the server ships.
# Naming the root's floor keeps the two resolutions the same by construction.
# Nothing supports *building* this crate on 1.95: `cargo fuzz` needs nightly.
# The `msrv` job in ci.yml asserts the root's `rust-version` and not this one,
# which is why this is written as the resolver knob it is.
rust-version = "1.95"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.volto]
path = ".."

# The root manifest denies `unsafe_code` for every target in the package; a
# separate workspace inherits none of that, so the policy is restated here. No
# target uses `unsafe` today, and a fuzz harness has no reason to start: the
# bytes it builds are the fuzzer's, and reading them through a raw pointer would
# hand libFuzzer a crash of the harness's own making that nobody could tell from
# a real find in `src/`.
[lints.rust]
unsafe_code = "deny"

# Same pin as the root manifest. This crate is its own workspace (cargo-fuzz
# convention), so the root's `[patch.crates-io]` does not reach it and the
# stanza has to be repeated; keep the rev in lockstep with `../Cargo.toml`,
# where the reasoning and the exit condition live.
[patch.crates-io]
quinn-proto = { git = "https://github.com/quinn-rs/quinn", rev = "48455d33be98128882d900dfcd7014b9a7beff6f" }

[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpack"
path = "fuzz_targets/qpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "huffman"
path = "fuzz_targets/huffman.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capsule"
path = "fuzz_targets/capsule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datagram"
path = "fuzz_targets/datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authority"
path = "fuzz_targets/authority.rs"
test = false
doc = false
