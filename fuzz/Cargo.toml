[package]
name = "volto-fuzz"
version = "0.0.0"
publish = false
# Edition 2024, as the root moved to in 93c043d, so a target cannot quietly keep
# an idiom `src/` has already left behind. Migrating changed no source: `cargo
# fix --edition` rewrote nothing, and the one `tail-expr-drop-order` warning it
# raised (in `frame`) is a `Bytes` refcount landing a few lines later, with no
# lock or channel behind it.
edition = "2024"

# A resolver input, not a support claim. Edition 2024 implies resolver 3, which
# is MSRV-aware, and with no `rust-version` here that resolver floors on
# whatever toolchain happens to be installed -- so a regeneration on a newer
# host could pull a dependency version the root's own floor would have
# refused, and this workspace would stop fuzzing the graph the server ships.
# Naming the root's floor keeps the two resolutions the same by construction.
# Nothing supports *building* this crate on that toolchain: `cargo fuzz` needs
# nightly. The `msrv` job in ci.yml builds the root crate and not this one, so
# this is the resolver knob it is written as; `tests/it_release_assets.rs`
# holds the value equal to the root's `rust-version`.
rust-version = "1.100"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"

[dependencies.volto]
path = ".."

# The root manifest denies `unsafe_code` for every target in the package; a
# separate workspace inherits none of that, so the policy is restated here. No
# target uses `unsafe` today, and a fuzz harness has no reason to start: the
# bytes it builds are the fuzzer's, and reading them through a raw pointer would
# hand libFuzzer a crash of the harness's own making that nobody could tell from
# a real find in `src/`.
[lints.rust]
unsafe_code = "deny"

[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpack"
path = "fuzz_targets/qpack.rs"
test = false
doc = false
bench = false

[[bin]]
